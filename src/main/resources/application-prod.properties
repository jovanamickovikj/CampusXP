# ─── PROD profile: PostgreSQL ────────────────────────────────────────────────
# Required environment variables:
#   DB_URL        e.g. jdbc:postgresql://localhost:5432/campusxp
#   DB_USERNAME   e.g. campusxp_user
#   DB_PASSWORD   strong password
#   JWT_SECRET    random string, min 32 characters

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campusxp}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:campusxp_user}
spring.datasource.password=${DB_PASSWORD:campusxp123}

# ─── HikariCP connection pool ─────────────────────────────────────────────────
# Sized for ~10k concurrent users with typical DB query times of 5–20 ms.
# Rule of thumb: pool_size = (core_count * 2) + effective_spindle_count
spring.datasource.hikari.pool-name=CampusXP-HikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
# Keep connections alive (avoids "connection closed" after idle)
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate = Hibernate checks schema matches entities but does NOT create or alter
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Batch inserts/updates for better throughput
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# H2 console disabled in prod
spring.h2.console.enabled=false

# Flyway manages schema in prod
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Upload directory
file.upload-dir=uploads

# Logging — suppress noisy framework output, keep app logs at INFO
logging.level.root=WARN
logging.level.mk.ukim.finki.campusxp=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
