spring.application.name=CampusXP
server.port=8081

# Active profile: "dev" uses H2 in-memory, "prod" uses PostgreSQL
# Override with: java -jar app.jar --spring.profiles.active=prod
spring.profiles.active=prod

# JWT — set JWT_SECRET env var in production (min 32 chars)
jwt.secret=${JWT_SECRET:campusxp-dev-only-secret-do-not-use-in-production!}
jwt.expiration=86400000

# File upload storage directory (relative to working directory)
file.upload-dir=uploads

# Multipart file upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# Actuator — only expose /health endpoint publicly
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
